    module2 /lib/x86_64-linux-gnu/libfontenc.so.1 /lib/x86_64-linux-gnu/libfontenc.so.1
    module2 /lib/x86_64-linux-gnu/libxkbfile.so.1 /lib/x86_64-linux-gnu/libxkbfile.so.1
    source /boot/grub/x11-share-modules.cfg

