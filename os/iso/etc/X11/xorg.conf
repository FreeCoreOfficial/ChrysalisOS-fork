Section "ServerLayout"
    Identifier     "Layout0"
    Screen      0  "Screen0"
EndSection

Section "Device"
    Identifier     "Device0"
    Driver         "fbdev"
    Option         "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Device0"
    DefaultDepth    24
    DefaultFbBpp    32
    SubSection "Display"
        Depth       24
        Modes       "1024x768"
    EndSubSection
EndSection

Section "Files"
    FontPath        "/usr/share/fonts/X11/misc"
EndSection
