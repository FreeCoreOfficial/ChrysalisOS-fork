# Load graphical modules
insmod png
insmod tga
insmod jpeg
insmod font
insmod gfxterm
insmod vbe
insmod vga

# Set graphics mode
set gfxmode=1024x768,800x600,auto
set gfxpayload=keep

# Enable graphical terminal
terminal_output gfxterm

set theme=/boot/grub/themes/chrysalis/theme.txt
set timeout=5
set default=0

menuentry "Chrysalis OS - Installer" {
  multiboot2 /boot/installer.elf
  module2 /boot/chrysalis/kernel.bin kernel.bin
  module2 /boot/chrysalis/kernel64.bin kernel64.bin
  module2 /boot/chrysalis/hello64.elf hello64.elf
  module2 /icons/*.bmp *.bmp
  module2 /system/tests/* *
  module2 /system/config/installer-ui-partlogic.conf installer-ui-partlogic.conf
  module2 /system/config/installer-ui-visopsys.conf installer-ui-visopsys.conf
  module2 /system/config/installer-ui.conf installer-ui.conf
  module2 /system/bg.bmp bg.bmp
  module2 /boot/grub/boot.img boot.img
  module2 /boot/grub/core.img core.img
  module2 /boot/grub/themes/chrysalis/background.tga background.tga
  module2 /boot/grub/themes/chrysalis/select_c.tga select_c.tga
  module2 /boot/grub/themes/chrysalis/theme.txt theme.txt
  boot
}
